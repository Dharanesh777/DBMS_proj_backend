# AG-OS Redis persistence config.
#
# By default, Redis (both its compiled-in defaults and the config Homebrew
# ships) has AOF (appendonly) OFF and only loose RDB snapshot points (as
# infrequent as one save per hour under light write load). Confirmed by
# inspecting the installed redis.conf and `CONFIG GET`: `appendonly no`,
# `save 3600 1 300 100 60 10000`. That's enough to lose everything on a
# crash or power loss between snapshots — which silently defeats the
# write-through session-state mirroring in app/services/session_service.py
# and app/routes/interaction_routes.py (see TECH_DEBT.md). Verified
# empirically: a bare `redis-server` with no persistence configured lost
# all mirrored state across a kill -9 / power-loss simulation.
#
# Start Redis with this file (in addition to, or instead of, the system
# default), e.g.:
#   redis-server /path/to/this/redis.conf
# or merge these directives into whatever config/systemd unit actually
# launches Redis on the target device.

# ── Durability ────────────────────────────────────────────────────────────
# AOF is the primary durability mechanism here — logs every write, replayed
# on restart. `everysec` (not `always`) fsyncs at most once per second: real
# protection against a crash/power-loss losing more than ~1s of writes,
# without the constant fsync-per-write wear `always` would put on an SD
# card over the device's lifetime.
appendonly yes
appendfsync everysec

# RDB snapshotting stays on too, as a second layer / faster full-reload path
# — these are Redis's own compiled-in defaults, restated here explicitly so
# they're not silently lost if this file is later trimmed:
save 3600 1
save 300 100
save 60 10000

# ── Data directory (optional) ───────────────────────────────────────────────
# If the target device has a mount other than the SD card available (e.g. a
# USB drive), pointing `dir` at it reduces SD card wear further on top of
# `everysec`. Not required — `everysec` on the SD card is an acceptable
# default. Uncomment and adjust the path to use it:
# dir /mnt/usb-redis-data
